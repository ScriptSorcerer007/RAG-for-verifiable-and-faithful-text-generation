<!DOCTYPE html>
<html>
<head>

<title>VeritasAI - Truth Grounded RAG</title>

<style>

body{
margin:0;
font-family:Arial;
background: radial-gradient(circle at top,#0f172a,#020617);
color:white;
overflow:hidden;
}

/* Layout */

.container{
display:flex;
height:100vh;
}

/* Sidebar */

.sidebar{
width:260px;
background:rgba(255,255,255,0.08);
backdrop-filter: blur(18px) saturate(180%);
padding:20px;
border-right:1px solid rgba(255,255,255,0.15);
box-shadow:0 8px 32px rgba(0,0,0,0.3);
}

.sidebar h2{
margin-top:0;
}

.new-chat{
background:linear-gradient(135deg,#7c3aed,#5b21b6);
padding:10px;
border-radius:10px;
text-align:center;
cursor:pointer;
margin-bottom:20px;
transition:.2s;
}

.new-chat:hover{
transform:translateY(-2px);
box-shadow:0 6px 18px rgba(124,58,237,.6);
}

.history-item{
background:rgba(255,255,255,0.06);
padding:10px;
margin-top:10px;
border-radius:8px;
cursor:pointer;
transition:.2s;
}

.history-item:hover{
background:#7c3aed;
transform:translateX(4px);
}

/* Chat Area */

.chat-area{
flex:1;
display:flex;
flex-direction:column;
background:rgba(255,255,255,0.02);
backdrop-filter:blur(12px);
}

.chat-box{
flex:1;
overflow-y:auto;
padding:30px;
}

/* Messages */

.message{
margin-bottom:20px;
padding:16px;
border-radius:14px;
max-width:65%;
animation:fadeIn .25s ease;
backdrop-filter:blur(10px);
box-shadow:0 8px 20px rgba(0,0,0,0.3);
}

.user{
background:linear-gradient(135deg,#7c3aed,#6d28d9);
margin-left:auto;
}

.bot{
background:rgba(255,255,255,0.07);
border:1px solid rgba(255,255,255,0.1);
}

/* Input Area */

.input-area{
display:flex;
gap:10px;
padding:20px;
border-top:1px solid rgba(255,255,255,0.1);
}

input[type=text]{
flex:1;
padding:12px;
border-radius:10px;
border:none;
outline:none;
background:rgba(255,255,255,0.08);
color:white;
}

button{
padding:12px 18px;
border:none;
border-radius:10px;
background:linear-gradient(135deg,#7c3aed,#5b21b6);
color:white;
cursor:pointer;
transition:all .25s ease;
}

button:hover{
transform:translateY(-2px);
box-shadow:0 6px 18px rgba(124,58,237,.5);
}

.upload-btn{
font-size:20px;
cursor:pointer;
}

/* Evidence Panel */

.evidence-panel{
width:320px;
background:rgba(255,255,255,0.06);
backdrop-filter:blur(20px);
border-left:1px solid rgba(255,255,255,0.15);
padding:20px;
overflow-y:auto;
}

.evidence-box{
background:rgba(255,255,255,0.05);
padding:12px;
border-radius:10px;
margin-bottom:12px;
}

/* Citations */

.citation{
color:#c4b5fd;
cursor:pointer;
font-weight:bold;
padding:2px 6px;
border-radius:6px;
transition:all .2s;
}

.citation:hover{
background:#7c3aed;
color:white;
box-shadow:0 0 10px #7c3aed;
}

/* Tooltip */

.tooltip{
position:absolute;
background:#111;
padding:8px;
border-radius:6px;
font-size:12px;
display:none;
z-index:100;
}

/* Trust Score */

.bar{
height:6px;
background:#222;
border-radius:4px;
margin-top:4px;
}

.bar-fill{
height:6px;
background:#7c3aed;
border-radius:4px;
}

/* Modal Evidence */

.modal{
display:none;
position:fixed;
z-index:1000;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
backdrop-filter:blur(6px);
}

.modal-content{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(20px);
margin:6% auto;
padding:20px;
width:600px;
border-radius:16px;
box-shadow:0 20px 60px rgba(0,0,0,0.5);
animation:fadeIn .3s ease;
}

.close{
float:right;
font-size:22px;
cursor:pointer;
}

/* Animations */

@keyframes fadeIn{
from{opacity:0;transform:translateY(8px);}
to{opacity:1;transform:translateY(0);}
}

</style>
</head>

<body>

<div class="container">

<!-- Sidebar -->

<div class="sidebar">

<h2>VeritasAI</h2>

<div class="new-chat" onclick="newChat()">+ New Chat</div>

<div id="history"></div>

</div>

<!-- Chat -->

<div class="chat-area">

<div class="chat-box" id="chat"></div>

<div class="input-area">

<label class="upload-btn">
📎
<input type="file" id="pdfFile" hidden onchange="uploadPDF()">
<div id="uploadProgress" style="display:none;margin-top:10px">
    <div id="uploadText">Uploading...</div>

    <div style="height:8px;background:#222;border-radius:6px;margin-top:6px">
        <div id="progressBar"
             style="height:8px;width:0%;background:#7c3aed;border-radius:6px">
        </div>
    </div>
</div>
</label>

<input type="text" id="question" placeholder="Ask anything...">

<button onclick="askQuestion()">Send</button>

</div>

</div>

<!-- Evidence Panel -->

<div class="evidence-panel">

<h3>Evidence</h3>

<div id="evidenceContent">
Click a citation to view evidence
</div>

</div>

</div>

<!-- Tooltip -->

<div id="tooltip" class="tooltip"></div>

<!-- Evidence Modal -->

<div id="evidenceModal" class="modal">

<div class="modal-content">

<span class="close" onclick="closeEvidence()">×</span>

<div id="modalBody"></div>

</div>

</div>

<script>

let chatSessions = JSON.parse(localStorage.getItem("chats")) || {}
let currentChat = null
let currentSources = []

function newChat(){

currentChat=Date.now()

chatSessions[currentChat]={title:null,messages:[]}

document.getElementById("chat").innerHTML=""

}

/* Upload */

async function uploadPDF(){

let fileInput=document.getElementById("pdfFile")

if(!fileInput.files.length) return

let progressBox=document.getElementById("uploadProgress")
let progressBar=document.getElementById("progressBar")
let progressText=document.getElementById("uploadText")

progressBox.style.display="block"

function setProgress(p,text){
progressBar.style.width=p+"%"
progressText.innerText=text
}

setProgress(10,"Uploading PDF...")

let formData=new FormData()
formData.append("file",fileInput.files[0])

setProgress(20,"Sending file to server...")

let response=await fetch("/upload-pdf/",{
method:"POST",
body:formData
})

setProgress(40,"Extracting text...")

await new Promise(r=>setTimeout(r,400))

setProgress(60,"Chunking document...")

await new Promise(r=>setTimeout(r,400))

setProgress(80,"Creating embeddings...")

await new Promise(r=>setTimeout(r,400))

setProgress(95,"Building vector index...")

let data=await response.json()

setProgress(100,"Document ready!")

setTimeout(()=>{
progressBox.style.display="none"
alert(data.message)
},800)

}

/* Ask */

async function askQuestion(){

let question=document.getElementById("question").value

if(!question) return

if(!currentChat) newChat()

addMessage(question,"user")
saveMessage(question,"user")

document.getElementById("question").value=""

let loading=addMessage("Thinking...","bot")

let response=await fetch("/ask/",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({question:question})
})

let data=await response.json()

loading.remove()

currentSources=data.sources

let botMessage = addMessage("", "bot")

streamText(botMessage,data.answer)

let trust = (data.faithfulness_score * 100).toFixed(0)

setTimeout(()=>{

botMessage.innerHTML = `

${addCitations(data.answer)}

<div style="margin-top:10px;font-size:12px">

Trust Score: ${trust}%

<div class="bar">
<div class="bar-fill" style="width:${trust}%"></div>
</div>

Alignment Score: ${data.alignment_score}

</div>

`

}, data.answer.length * 25)

saveMessage(data.answer,"bot")

if(!chatSessions[currentChat].title){

chatSessions[currentChat].title=generateTitle(question)
updateSidebar()

}

}

/* Streaming */

function streamText(element,text){

let words=text.split(" ")

let i=0

let interval=setInterval(()=>{

element.innerHTML+=words[i]+" "

scrollChat()

i++

if(i>=words.length){
clearInterval(interval)
}

},25)

}

/* Add message */

function addMessage(text,type){

let div=document.createElement("div")

div.className="message "+type

div.innerHTML=text

document.getElementById("chat").appendChild(div)

scrollChat()

return div

}

function scrollChat(){

let chat=document.getElementById("chat")

chat.scrollTop=chat.scrollHeight

}

function saveMessage(text,type){

chatSessions[currentChat].messages.push({text:text,type:type})

}

/* Citations */

function addCitations(text){

let sentences=text.split(". ")

let result=""

sentences.forEach((s,i)=>{

if(s.trim().length>0){

result+=`${s}. <span class="citation"
onclick="showEvidence(${i})"
onmouseover="showTooltip(event,${i})"
onmouseout="hideTooltip()">[${i+1}]</span> `

}

})

return result

}

/* Evidence Modal */

function showEvidence(index){

let src=currentSources[index]

if(!src) return

let html=`

<h3>${src.document}</h3>

<p><b>Page:</b> ${src.page}</p>

<p><b>Evidence Chunk:</b></p>

<p>${src.chunk}</p>

<iframe src="${src.link}" width="100%" height="400" style="border:none;border-radius:10px"></iframe>

`

document.getElementById("modalBody").innerHTML=html

document.getElementById("evidenceModal").style.display="block"

}

function closeEvidence(){
document.getElementById("evidenceModal").style.display="none"
}

/* Tooltip */

function showTooltip(event,index){

let src=currentSources[index]

if(!src) return

let tooltip=document.getElementById("tooltip")

tooltip.innerHTML=`<b>${src.document}</b><br>Page ${src.page}`

tooltip.style.display="block"

tooltip.style.left=event.pageX+"px"

tooltip.style.top=event.pageY+"px"

}

function hideTooltip(){
document.getElementById("tooltip").style.display="none"
}

/* Sidebar */

function generateTitle(question){
let words=question.split(" ")
return words.slice(0,4).join(" ")+"..."
}

function updateSidebar(){

let history=document.getElementById("history")

history.innerHTML=""

Object.keys(chatSessions).forEach(id=>{

let chat=chatSessions[id]

if(!chat.title) return

let div=document.createElement("div")

div.className="history-item"

div.innerText=chat.title

div.onclick=()=>loadChat(id)

history.appendChild(div)

})

}

function loadChat(id){

currentChat=id

let chat=chatSessions[id]

let chatBox=document.getElementById("chat")

chatBox.innerHTML=""

chat.messages.forEach(msg=>{
addMessage(msg.text,msg.type)
})

}

/* Enter */

document.getElementById("question").addEventListener("keypress",function(e){
if(e.key==="Enter") askQuestion()
})

</script>

</body>
</html>
