<!DOCTYPE html>
<html>
<head>

<title>VeritasAI Analytics</title>

<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>

/* BASE */
body{
margin:0;
font-family:Arial;
color:white;
overflow:auto;

background:
radial-gradient(circle at 20% 20%,rgba(124,58,237,.25),transparent 40%),
radial-gradient(circle at 80% 30%,rgba(91,33,182,.25),transparent 40%),
linear-gradient(180deg,#020617,#0f172a);
}

/* LAYOUT */
.container{
display:flex;
height:100vh;
}

/* SIDEBAR */
.sidebar{
width:260px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(20px);
padding:20px;
border-right:1px solid rgba(255,255,255,0.1);
}

.sidebar h2{
font-family:'Oxanium';
}

.nav-item{
padding:10px;
margin-top:10px;
border-radius:8px;
cursor:pointer;
background:rgba(255,255,255,0.05);
}

.nav-item:hover{
background:#7c3aed;
}

/* MAIN AREA */
.chat-area{
flex:1;
padding:30px;
overflow:auto;
}

/* METRICS */
.metrics{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
margin-bottom:30px;
}

.metric-card{
background:rgba(255,255,255,0.06);
padding:20px;
border-radius:14px;
border:1px solid rgba(255,255,255,0.1);
transition:.3s;
}

.metric-card:hover{
transform:translateY(-5px);
box-shadow:0 15px 40px rgba(124,58,237,.4);
}

.metric-card h3{
font-size:14px;
color:#a78bfa;
}

.metric-card p{
font-size:26px;
font-weight:bold;
}

/* CHARTS */
.charts{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-bottom:30px;
}

/* TABLE */
.table-box{
background:rgba(255,255,255,0.05);
padding:20px;
border-radius:12px;
border:1px solid rgba(255,255,255,0.1);
}

.row{
padding:10px;
border-bottom:1px solid rgba(255,255,255,0.1);
}

</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
<h2>VeritasAI</h2>

<div class="nav-item">📊 Dashboard</div>
<div class="nav-item">⚡ Performance</div>
<div class="nav-item">❌ Errors</div>

</div>

<!-- MAIN -->
<div class="chat-area">

<!-- METRICS -->
<div class="metrics">

<div class="metric-card">
<h3>Total Queries</h3>
<p id="totalQueries">0</p>
</div>

<div class="metric-card">
<h3>Avg Response</h3>
<p id="avgTime">0s</p>
</div>

<div class="metric-card">
<h3>Cache Hit</h3>
<p id="cacheRate">0%</p>
</div>

<div class="metric-card">
<h3>Errors</h3>
<p id="errorCount">0</p>
</div>

</div>

<!-- CHARTS -->
<div class="charts">
<canvas id="queryChart"></canvas>
<canvas id="cacheChart"></canvas>
</div>

<!-- TOP QUERIES -->
<div class="table-box">
<h3>Top Queries</h3>
<div id="topQueries"></div>
</div>

</div>
</div>

<script>

/* BACKGROUND */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('bg')});
renderer.setSize(innerWidth, innerHeight);

let geo = new THREE.BufferGeometry();
let vertices = [];

for(let i=0;i<400;i++){
vertices.push((Math.random()-0.5)*200);
vertices.push((Math.random()-0.5)*200);
vertices.push((Math.random()-0.5)*200);
}

geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices,3));
let mat = new THREE.PointsMaterial({size:1});
let points = new THREE.Points(geo,mat);

scene.add(points);
camera.position.z=100;

function animate(){
requestAnimationFrame(animate);
points.rotation.y += 0.001;
renderer.render(scene,camera);
}
animate();

/* ANALYTICS */
async function loadAnalytics(){

try{

let res = await fetch("/analytics/summary/");
let data = await res.json();

document.getElementById("totalQueries").innerText = data.total_queries || 0;
document.getElementById("avgTime").innerText = (data.avg_response_time || 0).toFixed(2) + "s";
document.getElementById("errorCount").innerText = data.errors || 0;

let rate = data.total_queries ? ((data.cache_hits / data.total_queries) * 100).toFixed(1) : 0;
document.getElementById("cacheRate").innerText = rate + "%";

/* TOP */
let tq = await fetch("/analytics/top-queries/");
let tqData = await tq.json();

let html="";
tqData.forEach(q=>{
html += `<div class="row">${q.query} (${q.count})</div>`;
});
document.getElementById("topQueries").innerHTML = html;

/* TREND */
let trend = await fetch("/analytics/query-trend/");
let trendData = await trend.json();

if(window.queryChart) window.queryChart.destroy();

window.queryChart = new Chart(document.getElementById("queryChart"), {
type:"line",
data:{
labels:trendData.map(x=>x.date),
datasets:[{
label:"Queries",
data:trendData.map(x=>x.count)
}]
}
});

/* CACHE */
if(window.cacheChart) window.cacheChart.destroy();

window.cacheChart = new Chart(document.getElementById("cacheChart"), {
type:"doughnut",
data:{
labels:["Hit","Miss"],
datasets:[{
data:[
data.cache_hits,
data.total_queries - data.cache_hits
]
}]
}
});

}catch(err){
console.log("Analytics error:", err);
}

}

loadAnalytics();
setInterval(loadAnalytics,5000);

</script>

</body>
</html>
